# Language for visitors landing on "/". Only the first (most preferred) entry of
# Accept-Language is considered: Korean or no header -> ko, anything else -> en.
map $http_accept_language $preferred_lang {
    default en;
    ""      ko;
    ~*^ko   ko;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    # Keep redirects relative: TLS and the public hostname are handled upstream
    # (Traefik / Cloudflare Tunnel), so nginx must not put its own scheme or port in them.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    # Liveness/readiness probe target.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        add_header Vary Accept-Language always;
        add_header Cache-Control "no-cache" always;
        return 302 /$preferred_lang/;
    }

    # Build output with content hashes in the file names; safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages and other files: always revalidate so a new deploy shows up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
