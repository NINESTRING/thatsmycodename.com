name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs on main are queued, never cancelled, so two builds cannot claim the same version.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/ninestring/thatsmycodename.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release git tag
      packages: write # push the image to GHCR
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags are needed to compute the next version

      # Version = YYYY.MM.DD.N (Asia/Seoul date, N = nth release of that day).
      # Tags are immutable: every release gets a new version and `latest` is never pushed.
      - name: Compute version
        id: version
        run: |
          date="$(TZ=Asia/Seoul date +%Y.%m.%d)"
          last="$(git tag --list "${date}.*" | sed "s/^${date}\.//" | sort -n | tail -n 1)"
          echo "version=${date}.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build both platforms without pushing, to verify the image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the release in git
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
